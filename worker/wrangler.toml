name = "urban-auto-tracking"
main = "src/index.js"
compatibility_date = "2026-01-01"
preview_urls = false

[vars]
# chat_id чатів, з яких бот приймає повідомлення (через кому): група + особистий чат для пересилання. Дізнатися: /id.
ALLOWED_CHATS = "-1004492547641,602387747"
# Адреса сайту трекера (для посилань клієнтам), GitHub Pages репозиторію
SITE_URL = "https://urbanauto.github.io/UrbanAutoTracking"
# З якого домену дозволено читати API (або "*")
ALLOWED_ORIGIN = "https://urbanauto.github.io"

# Договори: Telegram-ID користувачів, яким дозволено /договір (лише в особистому чаті з ботом)
CONTRACT_USERS = "602387747"
# Кінцева дата дії договору (підставляється в п. 6.1)
CONTRACT_VALID_UNTIL = "31.12.2027"

[triggers]
crons = ["* * * * *"]   # щохвилини: фото з буфера, що не знайшли підписаний альбом, прикріплюються до поточного авто

[[d1_databases]]
binding = "DB"
database_name = "urban-auto-tracking"
database_id = "05a9d0af-39c6-486a-ac56-c84e0500da57"

# Секрети (не в цьому файлі!):  wrangler secret put BOT_TOKEN   і   wrangler secret put WEBHOOK_SECRET
